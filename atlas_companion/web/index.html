<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas Companion</title><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/styles.css"><body><header><div><h1>Atlas Companion</h1><p>Local interface for durable Atlas tasks.</p></div><div id="status-strip" aria-live="polite">Loading runtime health…</div></header><main><nav><button data-screen="work">Work</button><button data-screen="health">Health</button></nav><section id="work-screen"><form id="new-task"><label>Objective<input name="objective" required></label><label>Success criteria <small>(one per line)</small><textarea name="criteria" required></textarea></label><button>Create and run</button></form><p id="message" role="status"></p><section><h2>Recent tasks</h2><div id="tasks"></div></section><section id="detail"><h2>Task detail</h2><p>Select a task to view durable status, results, and approvals.</p></section></section><section id="health-screen" hidden><h2>Health</h2><p class="hint">Live host and runtime telemetry. Missing host metrics are shown as unavailable.</p><div id="health" class="health-grid"></div></section></main><script src="/app.js"></script><script>navigator.serviceWorker?.register('/sw.js')</script></body></html>
