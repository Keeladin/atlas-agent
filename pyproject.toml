[project]
name = "atlas-agent"
version = "3.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=50.0.0",
    "httpx2>=2.12.0",
    "itsdangerous>=2.2",
    "mcp==2.0.0",
    "playwright>=1.55,<2",
    "pymupdf>=1.24",
    "python-magic>=0.4.27",
    "starlette>=0.40",
    "uvicorn>=0.52.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
